# ---------------------------------------------------------------------------
# OWASP NodeGoat - full application stack
# IE3142 DevOps Security :: Phase 1 (containerisation)
#
#   docker compose up --build      brings up the ENTIRE application
#   docker compose down            stops it (data survives)
#   docker compose down -v         stops it and destroys the database
#
# No `version:` key: it is obsolete from Compose v2 onward and emits a warning.
#
# Every setting is parameterised with a ${VAR:-default}. The stack therefore
# works on a fresh clone with NO .env file, while still allowing any value to be
# overridden locally. See .env.example.
# ---------------------------------------------------------------------------

name: nodegoat-devsec

services:

  # -------------------------------------------------------------------------
  # web - the NodeGoat Express application (the only publicly reachable service)
  # -------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: nodegoat-devsec/web:local
    container_name: nodegoat-web
    restart: unless-stopped

    environment:
      # Explicit, not inherited from the host shell. Upstream used a bare
      # `NODE_ENV:` passthrough, which made behaviour differ per developer.
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      # Service-name DNS on the private compose network. No credentials: the
      # database is unauthenticated and unreachable from outside the network.
      # Externalising this into a managed secret is a later-phase task.
      MONGODB_URI: mongodb://${MONGO_HOST:-mongo}:${MONGO_PORT:-27017}/${MONGO_DB:-nodegoat}

      # --- Secrets -------------------------------------------------------
      # Provisioned from .env, which is git-ignored. See .env.example and
      # docs/secrets.md.
      #
      # NOTE the syntax: `${SESSION_SECRET}` with NO `:-default`. Every other
      # variable in this file has a default so the stack runs from a fresh
      # clone; secrets deliberately do not, because a default secret in a
      # committed file is the problem we are removing. If unset, compose passes
      # an empty value and the application generates a random ephemeral key for
      # that process rather than using anything predictable.
      SESSION_SECRET: ${SESSION_SECRET:-}
      CRYPTO_KEY: ${CRYPTO_KEY:-}

      # --- Vault (optional) ----------------------------------------------
      # When VAULT_DEV_ROOT_TOKEN is set in .env, the vault-init service
      # provisions AppRole credentials and the entrypoint fetches secrets from
      # Vault, which take precedence over the values above. When it is not set,
      # Vault is skipped entirely and these values are used. See docs/secrets.md.
      VAULT_ADDR: http://vault:8200

    ports:
      # Bound to 127.0.0.1 by default. NodeGoat is deliberately vulnerable, so
      # it must NOT be reachable from the university LAN. Upstream's "4000:4000"
      # would have bound 0.0.0.0 and exposed it to every host on the network.
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-4000}:4000"

    depends_on:
      mongo:
        # Declarative startup ordering: compose will not start `web` until
        # mongo's healthcheck passes. Replaces upstream's `until nc -z ...`
        # shell retry loop, which also re-seeded the DB on every app crash.
        condition: service_healthy
      vault-init:
        # Wait for provisioning to finish before starting. vault-init exits 0
        # even when Vault is not configured, so this never blocks startup.
        condition: service_completed_successfully

    volumes:
      # AppRole credentials, read-only. role_id is an identity; secret_id is a
      # short-lived credential. Neither is the application secret itself.
      - vault-approle:/vault/approle:ro

    networks:
      - nodegoat-net

  # -------------------------------------------------------------------------
  # mongo - the application database
  # -------------------------------------------------------------------------
  mongo:
    # Pinned to 4.4 deliberately. MongoDB 5.0+ requires an AVX-capable CPU and
    # will crash-loop on older hardware; 4.4 keeps the stack runnable on every
    # team member's machine. Revisit when image scanning lands in a later phase.
    image: mongo:${MONGO_IMAGE_TAG:-4.4}
    container_name: nodegoat-mongo
    restart: unless-stopped

    # NOTE: there is intentionally NO `ports:` mapping here. The database is
    # published only to the internal compose network via `expose`, so it is
    # unreachable from the host and from the wider network. This is the
    # app <-> database trust boundary (see docs/architecture.md).
    expose:
      - "27017"

    volumes:
      # Named volume: database contents survive `docker compose down`.
      # Destroyed only by an explicit `docker compose down -v`.
      - mongo-data:/data/db

    networks:
      - nodegoat-net

    healthcheck:
      # mongo 4.4 ships the legacy `mongo` shell (5.0+ replaced it with mongosh).
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # -------------------------------------------------------------------------
  # vault - HashiCorp Vault, secrets manager
  #
  # Runs locally in dev mode, so the offline requirement is preserved: no cloud
  # service is contacted. Dev mode keeps everything in memory and auto-unseals,
  # which is appropriate for a teaching lab and explicitly NOT production - see
  # docs/secrets.md for what production would require instead.
  #
  # Not published to the host: like MongoDB, Vault is reachable only from the
  # private compose network.
  # -------------------------------------------------------------------------
  vault:
    image: hashicorp/vault:${VAULT_IMAGE_TAG:-2.1.0}
    container_name: nodegoat-vault
    restart: unless-stopped

    # Vault locks memory to keep secrets out of swap.
    cap_add:
      - IPC_LOCK

    environment:
      # No default, deliberately - same rule as every other secret in this file.
      # Unset means the Vault demonstration is simply skipped.
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN:-}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200

    command: ["server", "-dev"]

    expose:
      - "8200"

    volumes:
      - vault-audit:/vault/audit

    networks:
      - nodegoat-net

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8200/v1/sys/health?standbyok=true"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # -------------------------------------------------------------------------
  # vault-init - one-shot provisioning, then exits.
  #
  # Enables the audit device, generates the application secrets INSIDE Vault,
  # writes a least-privilege policy, and issues AppRole credentials.
  # Exits 0 without doing anything when VAULT_DEV_ROOT_TOKEN is unset, so the
  # stack starts normally with Vault disabled.
  # -------------------------------------------------------------------------
  vault-init:
    image: hashicorp/vault:${VAULT_IMAGE_TAG:-2.1.0}
    container_name: nodegoat-vault-init
    restart: "no"

    # Root solely to chown the audit volume, which Docker creates root-owned
    # while the Vault server runs as uid 100. This is a one-shot container that
    # exits after provisioning; no long-running service in this stack is root.
    user: root

    depends_on:
      vault:
        condition: service_healthy

    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:-}

    entrypoint: ["/bin/sh", "/init/vault-init.sh"]

    volumes:
      - ./docker/vault-init.sh:/init/vault-init.sh:ro
      - vault-approle:/vault/approle
      - vault-audit:/vault/audit

    networks:
      - nodegoat-net

# ---------------------------------------------------------------------------
volumes:
  mongo-data:
    name: nodegoat-mongo-data

  vault-approle:
    name: nodegoat-vault-approle
  vault-audit:
    name: nodegoat-vault-audit

networks:
  nodegoat-net:
    name: nodegoat-net
    driver: bridge
