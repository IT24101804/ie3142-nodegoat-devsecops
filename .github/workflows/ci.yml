# ---------------------------------------------------------------------------
# Continuous Integration
# IE3142 DevOps Security :: Phase 4, Step 1 (build + test pipeline)
#
# Runs on every push and every pull request. Fails the run if the code does not
# lint, the container image does not build, or the assembled application does
# not actually work.
#
# Security scanning (SAST, dependency, secrets, container) is Step 2 and is
# deliberately NOT here yet. The job graph below is shaped so those gates can be
# added as additional jobs without restructuring anything - see the comments at
# the bottom of this file.
# ---------------------------------------------------------------------------

name: CI

on:
  # Every push, on every branch. Feature branches get the same gate as main,
  # so problems surface before a pull request is ever opened.
  push:
  # Pull requests targeting main. This also covers forks, whose pushes do not
  # trigger the `push` event on this repository.
  pull_request:
    branches: [main]

# Least privilege. The default GITHUB_TOKEN is granted broad write scopes on
# some repository configurations; this narrows it to read-only, which is all a
# build-and-test pipeline needs. Step 2 jobs that upload SARIF results will need
# `security-events: write` added - scoped to that job, not globally.
permissions:
  contents: read

# If several commits are pushed to the same branch in quick succession, cancel
# the superseded runs. Saves runner minutes and means the status shown against a
# branch always reflects its newest commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # =========================================================================
  # JOB 1: lint
  #
  # Static analysis of the source. No Docker, no database - so it is the
  # fastest signal available and runs in parallel with the image build.
  # =========================================================================
  lint:
    name: Lint and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          # Matches the runtime in the Dockerfile. Linting on a different major
          # version than we ship would let syntax through that breaks at run time.
          node-version: '20'
          # Caches the npm download cache (~/.npm), keyed on package-lock.json.
          # The dev dependency tree is 962 packages and takes ~3 minutes to
          # install cold, so this is the single biggest time saving available.
          cache: 'npm'

      - name: Install dependencies
        # `npm ci` (not `npm install`) installs exactly the tree pinned in
        # package-lock.json and fails on lockfile drift, so CI builds the same
        # dependency set as every developer machine.
        run: npm ci --no-audit --no-fund
        env:
          # NodeGoat pins Cypress 3.3.1, whose postinstall downloads an ~80 MB
          # browser binary. We do not run Cypress in this pipeline (the suite is
          # not CI-ready - see the note at the bottom), so downloading it would
          # be pure cost and an extra network dependency that can flake.
          CYPRESS_INSTALL_BINARY: '0'

      - name: Lint JavaScript (jshint)
        # jshint is invoked DIRECTLY rather than through `grunt jshint`.
        #
        # This is deliberate and important. Gruntfile.js:156 sets
        # `grunt.option("force", true)`, which downgrades every task failure to
        # a warning and still exits 0. Verified: injecting two real lint errors
        # produced "Used --force, continuing" and exit code 0. Passing
        # `--no-force` does not help, because the Gruntfile sets the option
        # programmatically after the CLI is parsed.
        #
        # Calling jshint directly bypasses Grunt entirely and yields an honest
        # exit code (0 clean / 2 on error), which is what makes this a real gate
        # rather than decoration. The file list mirrors JS_FILES in Gruntfile.js.
        run: |
          npx jshint --exclude-path .jshintignore \
            app/assets/js \
            config \
            app/data \
            app/routes \
            server.js \
            Gruntfile.js \
            artifacts \
            test

      - name: Upstream unit tests (currently none - see note below)
        # Runs NodeGoat's own `npm test` so the upstream script is exercised and
        # visible in the pipeline.
        #
        # BE AWARE: this currently runs ZERO tests. `npm test` maps to
        # `grunt test` -> mochaTest:unit -> test/unit/*.js, and test/unit/ does
        # not exist in the upstream project. It reports "No files to check...OK"
        # and exits 0.
        #
        # It is kept, clearly labelled, rather than removed, so that nobody
        # mistakes a green tick here for real unit test coverage. The genuine
        # verification of application behaviour is the smoke-test job below.
        # Adding a real unit suite under test/unit/ would make this meaningful.
        run: npm test

  # =========================================================================
  # JOB 2: build
  #
  # Builds the application container image. Runs in PARALLEL with `lint` -
  # neither needs the other's output, so serialising them would only add
  # wall-clock time.
  #
  # The built image is exported as an artifact so later jobs consume the exact
  # bytes that were built, rather than rebuilding and hoping for the same
  # result. This also gives Step 2's container-scanning job something to scan
  # without a second build.
  # =========================================================================
  build:
    name: Build container image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Build the application image
        # `docker compose build` rather than a bare `docker build`, so CI builds
        # through exactly the same path a developer uses locally. If the compose
        # build context or args drift, CI notices.
        run: docker compose build web

      - name: Show what was built
        run: docker image ls nodegoat-devsec/web

      - name: Export the image as a tarball
        # `docker save` serialises the image so it can cross the job boundary.
        run: docker save nodegoat-devsec/web:local -o /tmp/nodegoat-web-image.tar

      - name: Upload the image artifact
        uses: actions/upload-artifact@v7
        with:
          name: nodegoat-web-image
          path: /tmp/nodegoat-web-image.tar
          # Short retention: this is a CI intermediate, not a release artefact.
          retention-days: 1
          compression-level: 6

  # =========================================================================
  # JOB 3: smoke-test
  #
  # Starts the FULL stack (app + MongoDB) from docker-compose.yml and asserts
  # the application actually works: serves pages, enforces auth, accepts a real
  # login, reads seeded data back out of the database, and keeps the database
  # off the host network.
  #
  # `needs: build` because it consumes the image artifact. This is the one real
  # dependency edge in the graph.
  #
  # This job is where genuine confidence comes from. NodeGoat ships no working
  # test suite, so rather than pretend otherwise, the pipeline verifies the
  # deployable artefact end to end.
  # =========================================================================
  smoke-test:
    name: Smoke test the running stack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build

    steps:
      - name: Check out the repository
        # Needed for docker-compose.yml and scripts/smoke-test.sh.
        uses: actions/checkout@v7

      - name: Download the image built by the build job
        uses: actions/download-artifact@v8
        with:
          name: nodegoat-web-image
          path: /tmp

      - name: Load the image into the local Docker daemon
        run: |
          docker load -i /tmp/nodegoat-web-image.tar
          docker image ls nodegoat-devsec/web

      - name: Start the full stack
        # --no-build  : use the loaded image. Guarantees we test the artefact the
        #               build job produced, not a fresh rebuild.
        # --wait      : block until every service reports healthy via its
        #               healthcheck, instead of sleeping and hoping. This is the
        #               same mechanism `depends_on: service_healthy` uses.
        run: docker compose up -d --no-build --wait --wait-timeout 180

      - name: Show container status
        run: docker compose ps

      - name: Run the smoke test suite
        # Exits non-zero on the first failed assertion, which fails the job and
        # therefore the whole run.
        run: bash scripts/smoke-test.sh

      - name: Dump container logs on failure
        # Only runs when something above failed. Without this, a red run gives
        # you an assertion message and no idea why the app misbehaved.
        if: failure()
        run: |
          echo "===================== web logs ====================="
          docker compose logs web || true
          echo "===================== mongo logs ==================="
          docker compose logs mongo || true
          echo "===================== ps ==========================="
          docker compose ps -a || true

      - name: Tear down the stack
        # `always()` so the teardown happens even when the tests failed.
        # -v removes the database volume, leaving no state behind.
        if: always()
        run: docker compose down -v --remove-orphans || true

  # =========================================================================
  # SECURITY GATE 1: sast  (Static Application Security Testing)
  #
  # Semgrep against the application source, using curated Node/Express and
  # OWASP rulesets.
  #
  # No `needs` - runs in parallel with lint, build and the other gates. It reads
  # only the source tree, so nothing has to be built first.
  #
  # TOOL CHOICE: Semgrep rather than eslint-plugin-security. This project lints
  # with jshint, not ESLint, so the ESLint route would mean introducing a second
  # linter and config purely for CI. Semgrep needs no project config, ships
  # curated Express/Node rulesets, and emits SARIF natively.
  #
  # THRESHOLD: ERROR is the actionable severity; WARNING is reported but noisy
  # (5 of the current WARNINGs are plain documentation hyperlinks in tutorial
  # HTML). See the enforcement block at the end of this job.
  #
  # REPORT-ONLY, DELIBERATELY. The current ERROR findings are NodeGoat's
  # intentional vulnerabilities - `code-string-concat` at
  # app/routes/contributions.js:32-33 is the eval() code injection the app
  # exists to teach. Remediation is owned by another team member and must not
  # happen yet, so enforcing here would make main permanently red for work this
  # pipeline is not allowed to fix. Secrets scanning is the enforcing gate.
  # =========================================================================
  sast:
    name: Security - SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      # Scoped to THIS JOB ONLY - the workflow default remains `contents: read`.
      # Required to upload SARIF to GitHub code scanning.
      security-events: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Run Semgrep
        # Run via the official container so the scanner version is explicit and
        # no Python toolchain has to be provisioned on the runner.
        #
        # `|| true` - Semgrep exits non-zero when it finds anything. This gate is
        # report-only, so the findings are captured and summarised below instead
        # of failing here. The enforcement block at the end of this job is the
        # single place that decides pass/fail.
        #
        # --metrics=off  : no telemetry to Semgrep's servers.
        # --exclude      : app/assets/vendor is third-party bundled jQuery and
        #                  Bootstrap; scanning it reports on code we do not own.
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:latest \
            semgrep scan \
              --config p/javascript \
              --config p/nodejs \
              --config p/owasp-top-ten \
              --exclude 'app/assets/vendor' \
              --exclude 'node_modules' \
              --metrics=off \
              --sarif-output=/src/semgrep.sarif \
              --json-output=/src/semgrep.json \
              app config server.js artifacts || true

          sudo chown "$(id -u):$(id -g)" semgrep.sarif semgrep.json || true
          ls -l semgrep.sarif semgrep.json

      - name: Summarise findings
        # Writes a table into the run's Summary tab. This is the evidence that
        # survives regardless of whether SARIF upload is available, and it is
        # what gets screenshotted for the report.
        run: |
          node -e '
            const fs = require("fs");
            const j = JSON.parse(fs.readFileSync("semgrep.json", "utf8"));
            const res = j.results || [];
            const bySev = {};
            const byRule = {};
            for (const r of res) {
              const sev = r.extra.severity;
              bySev[sev] = (bySev[sev] || 0) + 1;
              const id = r.check_id.split(".").pop();
              byRule[id] = byRule[id] || { n: 0, sev, loc: [] };
              byRule[id].n++;
              if (byRule[id].loc.length < 3) byRule[id].loc.push(r.path + ":" + r.start.line);
            }
            let md = "## SAST (Semgrep)\n\n";
            md += "**Total findings: " + res.length + "** - ";
            md += Object.entries(bySev).map(([k, v]) => k + ": " + v).join(", ") + "\n\n";
            md += "| Severity | Count | Rule | Example locations |\n|---|---|---|---|\n";
            for (const [id, v] of Object.entries(byRule).sort((a, b) => b[1].n - a[1].n)) {
              md += "| " + v.sev + " | " + v.n + " | `" + id + "` | " + v.loc.join("<br>") + " |\n";
            }
            md += "\n_Report-only gate. ERROR findings are NodeGoat vulnerabilities owned by the remediation workstream._\n";
            fs.writeFileSync(process.env.GITHUB_STEP_SUMMARY, md, { flag: "a" });
            console.log(md);
          '

      - name: Upload SARIF to GitHub code scanning
        # Code scanning (the repository Security tab) requires GitHub Advanced
        # Security on PRIVATE repositories. This repository is private and does
        # not have it - verified: /security/code-scanning returns 404, and the
        # upload failed with "Resource not accessible by integration".
        #
        # The step is therefore SKIPPED on private repositories rather than run
        # and allowed to fail. Running a step that cannot succeed produces a red
        # error annotation on an otherwise green run, which is misleading.
        #
        # It is kept, not deleted, so the pipeline works unchanged if the
        # repository is later made public or Advanced Security is enabled.
        # Findings are published to the job summary and uploaded as an artifact
        # regardless, so evidence never depends on this step.
        if: github.event.repository.private == false
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Upload scan results as an artifact
        # Always available, regardless of Advanced Security. This is the
        # downloadable evidence for the report.
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sast-semgrep-results
          path: |
            semgrep.sarif
            semgrep.json
          retention-days: 7

      - name: Gate decision
        # The single place that decides pass/fail for this job.
        #
        # Currently REPORTS the ERROR count without failing, for the reason given
        # in the job header. To make this gate enforcing, delete the `echo` line
        # below and uncomment the `exit 1`. Nothing else needs to change.
        run: |
          ERRORS=$(node -e '
            const j = require("./semgrep.json");
            console.log((j.results || []).filter(r => r.extra.severity === "ERROR").length);
          ')
          echo "ERROR-severity findings: $ERRORS"

          if [ "$ERRORS" -gt 0 ]; then
            echo "::warning::SAST found $ERRORS ERROR-severity finding(s). Reported, not enforced - these are NodeGoat's intentional vulnerabilities, owned by the remediation workstream."
            echo "Gate is REPORT-ONLY. Not failing the build."
            # exit 1   # <-- uncomment to make this gate enforcing
          else
            echo "No ERROR-severity findings."
          fi

  # =========================================================================
  # SECURITY GATE 2: dependency-scan  (SCA - Software Composition Analysis)
  #
  # npm audit against the pinned dependency tree in package-lock.json.
  #
  # No `needs` - runs in parallel with everything else.
  #
  # TOOL CHOICE: npm audit rather than Snyk or OWASP Dependency-Check.
  #   - Snyk requires a SNYK_TOKEN repository secret; this pipeline needs no
  #     credentials at all, which is one less thing to leak or rotate.
  #   - OWASP Dependency-Check downloads the full NVD feed (several minutes per
  #     run) and is aimed at Java ecosystems.
  #   - npm audit is native to this ecosystem, reads our exact lockfile, and is
  #     already present on the runner.
  #
  # NOTE: no `npm ci` step. npm audit resolves package-lock.json against the
  # registry advisory API and does not need node_modules installed, so this is
  # the cheapest of the four gates.
  #
  # SCOPE: --omit=dev. This is a deliberate decision worth defending. The
  # Dockerfile builds the runtime image with `npm ci --omit=dev`, so dev
  # dependencies (grunt, cypress, mocha, jshint) are NOT shipped and are not
  # attack surface for the deployed application. Scanning them inflates the
  # numbers without reflecting real risk: the full tree reports 145
  # vulnerabilities, production-only reports 51. Both counts are printed in the
  # summary so the effect of this scoping is visible rather than hidden.
  #
  # THRESHOLD: critical.
  #
  # REPORT-ONLY, DELIBERATELY. The 16 critical advisories are unfixable without
  # replacing NodeGoat's dependency tree - underscore (arbitrary code
  # execution), swig (arbitrary file read), bson (CVE-2019-2391), and several
  # prototype-pollution advisories. Vulnerable dependencies are OWASP A9 and are
  # exactly what this application exists to demonstrate; remediation belongs to
  # another team member. Secrets scanning is the enforcing gate.
  # =========================================================================
  dependency-scan:
    name: Security - Dependency scan (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Run npm audit
        # `|| true` on both: npm audit exits non-zero whenever it finds anything
        # at or above the audit level. This gate is report-only, so findings are
        # captured here and the pass/fail decision is made once, at the end.
        run: |
          echo "--- production dependencies (what actually ships) ---"
          npm audit --omit=dev --json > audit-prod.json 2>/dev/null || true

          echo "--- full tree, for comparison only ---"
          npm audit --json > audit-all.json 2>/dev/null || true

          ls -l audit-prod.json audit-all.json

      - name: Summarise findings
        # The summariser is written to a file with a QUOTED heredoc (<<'EOF')
        # rather than passed inline via `node -e '...'`.
        #
        # Reason: inside a single-quoted shell string, an apostrophe in ordinary
        # English prose ("NodeGoat's") terminates the quote early and bash then
        # fails to parse the remainder, exiting 2. That is precisely what broke
        # run #7. A quoted heredoc makes the entire block literal - no shell
        # interpretation of quotes, backticks or $ - so prose can be written
        # normally and the script cannot be broken by its own text.
        run: |
          cat > /tmp/summarise-audit.js <<'SUMMARISER'
          const fs = require("fs");
          const load = f => { try { return JSON.parse(fs.readFileSync(f, "utf8")); } catch (e) { return null; } };
          const prod = load("audit-prod.json");
          const all  = load("audit-all.json");

          const counts = j => (j && j.metadata && j.metadata.vulnerabilities) || {};
          const p = counts(prod), a = counts(all);

          let md = "## Dependency scan (npm audit)\n\n";
          md += "| Scope | Critical | High | Moderate | Low | Total |\n|---|---|---|---|---|---|\n";
          md += "| **Production** (`--omit=dev`, what ships) | " + (p.critical||0) + " | " + (p.high||0) + " | " + (p.moderate||0) + " | " + (p.low||0) + " | **" + (p.total||0) + "** |\n";
          md += "| Full tree (incl. dev, for comparison) | " + (a.critical||0) + " | " + (a.high||0) + " | " + (a.moderate||0) + " | " + (a.low||0) + " | " + (a.total||0) + " |\n\n";

          const vulns = (prod && prod.vulnerabilities) || {};
          const crit = [];
          for (const [name, v] of Object.entries(vulns)) {
            if (v.severity !== "critical") continue;
            const titles = (v.via || []).filter(x => typeof x === "object").map(x => x.title);
            crit.push({ name, title: titles[0] || "(vulnerable transitive dependency)" });
          }
          if (crit.length) {
            md += "### Critical advisories in production dependencies (" + crit.length + ")\n\n";
            md += "| Package | Advisory |\n|---|---|\n";
            for (const c of crit) md += "| `" + c.name + "` | " + c.title + " |\n";
          }
          md += "\n_Report-only gate. These are OWASP A9 findings: the intentional vulnerable dependencies NodeGoat ships, owned by the remediation workstream. Dev dependencies are excluded because `npm ci --omit=dev` means they are not present in the runtime image._\n";

          fs.writeFileSync(process.env.GITHUB_STEP_SUMMARY, md, { flag: "a" });
          console.log(md);
          SUMMARISER

          node /tmp/summarise-audit.js

      - name: Upload audit results as an artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-scan-npm-audit-results
          path: |
            audit-prod.json
            audit-all.json
          retention-days: 7

      - name: Gate decision
        # Threshold is `critical` on production dependencies.
        #
        # Currently REPORTS without failing, for the reason in the job header.
        # To make this gate enforcing, delete the echo and uncomment `exit 1`.
        run: |
          CRITICAL=$(node -e '
            const j = require("./audit-prod.json");
            console.log(((j.metadata||{}).vulnerabilities||{}).critical || 0);
          ')
          HIGH=$(node -e '
            const j = require("./audit-prod.json");
            console.log(((j.metadata||{}).vulnerabilities||{}).high || 0);
          ')
          echo "Production dependencies - critical: $CRITICAL, high: $HIGH"

          if [ "$CRITICAL" -gt 0 ]; then
            echo "::warning::Dependency scan found $CRITICAL critical advisory/advisories in production dependencies. Reported, not enforced - these are NodeGoat's intentional vulnerable dependencies (OWASP A9), owned by the remediation workstream."
            echo "Gate is REPORT-ONLY. Not failing the build."
            # exit 1   # <-- uncomment to make this gate enforcing
          else
            echo "No critical advisories in production dependencies."
          fi

  # =========================================================================
  # SECURITY GATE 3: secrets-scan   *** THIS IS THE ENFORCING GATE ***
  #
  # Gitleaks over the working tree AND the full git history.
  #
  # No `needs` - runs in parallel with everything else.
  #
  # TOOL CHOICE: Gitleaks, run from its official container rather than via
  # gitleaks-action. The action requires a GITLEAKS_LICENSE for organization
  # accounts; running the container keeps this pipeline free of any licensing
  # or credential dependency.
  #
  # WHY THIS IS THE GATE THAT ENFORCES
  #   - A leaked credential is binary. There is no defensible "acceptable
  #     number of leaked secrets", unlike CVE counts where risk is graduated.
  #   - Noise is near zero: 2 precise findings on this repository, both known.
  #   - A NEW secret is never intentional NodeGoat behaviour, so enforcing here
  #     never conflicts with the vulnerability-remediation workstream. The SAST
  #     and dependency gates cannot say that - their findings are deliberate.
  #
  # BASELINE, NOT SUPPRESSION
  # .gitleaksignore records the 2 secrets upstream NodeGoat already shipped, by
  # exact fingerprint (commit:file:rule:line), each with a written reason. The
  # gate therefore blocks anything NEW without being permanently red over
  # pre-existing upstream findings. Because entries are exact fingerprints, a
  # different secret in the same file - or the same secret moved to a new
  # commit - still fails. The baseline is committed, commented, and every scan
  # report is uploaded as an artifact, so nothing is hidden.
  #
  # Verified locally before this job was written:
  #   with baseline, clean tree       -> "no leaks found", exit 0
  #   with baseline, new secret added -> "leaks found: 1",  exit 1
  # =========================================================================
  secrets-scan:
    name: Security - Secrets scan (Gitleaks) [ENFORCING]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository with full history
        uses: actions/checkout@v7
        with:
          # CRITICAL: the default checkout is shallow (depth 1), which would let
          # Gitleaks see only the newest commit. A secret committed and then
          # deleted in a later commit is still leaked and must still be caught,
          # so the whole history has to be present.
          fetch-depth: 0

      - name: Run Gitleaks
        # --redact             : never print secret values into CI logs, which
        #                        are themselves a disclosure channel.
        # --gitleaks-ignore-path : apply the committed baseline.
        # --report-format json : machine-readable evidence for the artifact.
        #
        # `|| true` captures the exit status instead of aborting here, so the
        # report is always written and uploaded even on a failing run. The
        # pass/fail decision is made once, in the gate step below.
        run: |
          set +e
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            detect \
              --source /repo \
              --no-banner \
              --redact \
              --gitleaks-ignore-path /repo/.gitleaksignore \
              --report-format json \
              --report-path /repo/gitleaks-report.json
          echo "GITLEAKS_EXIT=$?" >> "$GITHUB_ENV"
          set -e

          sudo chown "$(id -u):$(id -g)" gitleaks-report.json 2>/dev/null || true
          ls -l gitleaks-report.json 2>/dev/null || echo "[]" > gitleaks-report.json

      - name: Summarise findings
        # Quoted heredoc - see the dependency-scan job for why inline
        # `node -e '...'` is avoided.
        run: |
          cat > /tmp/summarise-gitleaks.js <<'SUMMARISER'
          const fs = require("fs");
          let findings = [];
          try { findings = JSON.parse(fs.readFileSync("gitleaks-report.json", "utf8")) || []; } catch (e) { findings = []; }

          const baselineCount = (fs.readFileSync(".gitleaksignore", "utf8").split("\n")
            .filter(l => l.trim() && !l.trim().startsWith("#"))).length;

          let md = "## Secrets scan (Gitleaks) - ENFORCING GATE\n\n";
          md += "- Baselined known upstream findings: **" + baselineCount + "**\n";
          md += "- New findings this run: **" + findings.length + "**\n\n";

          if (findings.length === 0) {
            md += "No new secrets detected. Gate passes.\n\n";
            md += "The " + baselineCount + " baselined findings are the OWASP ZAP API key that upstream NodeGoat ships in its development and test configs. They are recorded in `.gitleaksignore` with justifications and documented in README.md.\n";
          } else {
            md += "**BUILD BLOCKED.** A secret that is not in the baseline was detected.\n\n";
            md += "| Rule | File | Line | Commit | Entropy |\n|---|---|---|---|---|\n";
            for (const f of findings) {
              md += "| `" + f.RuleID + "` | `" + f.File + "` | " + f.StartLine + " | `" + String(f.Commit).slice(0, 10) + "` | " + String(f.Entropy).slice(0, 5) + " |\n";
            }
            md += "\nSecret values are redacted from logs deliberately: CI logs are themselves a disclosure channel.\n\n";
            md += "**Do not add these to `.gitleaksignore` to make the build pass.** Remove the secret, rotate it if it was ever real, and purge it from git history.\n";
          }

          fs.writeFileSync(process.env.GITHUB_STEP_SUMMARY, md, { flag: "a" });
          console.log(md);
          SUMMARISER

          node /tmp/summarise-gitleaks.js

      - name: Upload scan report as an artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: secrets-scan-gitleaks-report
          path: gitleaks-report.json
          retention-days: 7

      - name: Gate decision (ENFORCING)
        # Unlike the other three gates, this one genuinely fails the build.
        # Gitleaks exits 1 when it finds anything outside the baseline.
        run: |
          echo "Gitleaks exit code: ${GITLEAKS_EXIT}"

          if [ "${GITLEAKS_EXIT}" != "0" ]; then
            echo "::error::Secrets scan FAILED. A secret not present in the baseline was detected. Remove it and purge it from git history - do not add it to .gitleaksignore."
            echo "BUILD BLOCKED by the secrets gate."
            exit 1
          fi

          echo "No new secrets detected. Gate passes."

  # =========================================================================
  # SECURITY GATE 4: container-scan
  #
  # Trivy against the container image THIS RUN built.
  #
  # `needs: build` - the one gate with a dependency. It downloads the image
  # artifact the build job already publishes and loads it, so the image is
  # scanned exactly once and built exactly once. Rebuilding here would waste a
  # minute and, worse, risk scanning a different image than the one the smoke
  # test exercised. This is precisely why the build job exports the image
  # rather than keeping it local to itself.
  #
  # No checkout step: this job scans a built artifact, not source. Nothing from
  # the repository is needed.
  #
  # TOOL CHOICE: Trivy. Scans OS packages and language dependencies in one
  # pass, needs no credentials, and consumes a local image directly from the
  # Docker daemon.
  #
  # THRESHOLD: CRITICAL and HIGH.
  #
  # REPORT-ONLY, DELIBERATELY. Local preview: 9 CRITICAL and 58 HIGH, but the
  # split matters and is surfaced in the summary below:
  #     Alpine OS packages : 4 HIGH, 0 CRITICAL
  #     Node.js packages   : 54 HIGH, 9 CRITICAL
  # Almost every finding is NodeGoat's own 2016-era dependency tree, which the
  # dependency-scan gate already reports and which the remediation workstream
  # owns. The base image itself is nearly clean, which retrospectively
  # validates the Phase 1 decision to move off the EOL node:12-alpine.
  #
  # A future enforcing threshold is computed and printed below: OS-level
  # CRITICAL only, currently 0. That would catch a regression in the base image
  # without being blocked by the application's intentional vulnerabilities.
  # =========================================================================
  container-scan:
    name: Security - Container scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build

    steps:
      - name: Download the image built by the build job
        uses: actions/download-artifact@v8
        with:
          name: nodegoat-web-image
          path: /tmp

      - name: Load the image into the local Docker daemon
        run: |
          docker load -i /tmp/nodegoat-web-image.tar
          docker image ls nodegoat-devsec/web

      - name: Run Trivy
        # Pinned to an exact version, not :latest, so scan results are
        # reproducible run to run. The Docker socket is mounted so Trivy can
        # read the image straight from the daemon rather than re-pulling it.
        #
        # --scanners vuln : CVEs only. Misconfiguration and licence scanning
        #                   are separate concerns and would add noise here.
        # --exit-code 0   : never fail on findings. This gate is report-only
        #                   and the decision is made once, in the gate step.
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/out" \
            aquasec/trivy:0.74.0 image \
              --scanners vuln \
              --severity CRITICAL,HIGH \
              --format json \
              --output /out/trivy-report.json \
              --exit-code 0 \
              --quiet \
              nodegoat-devsec/web:local

          sudo chown "$(id -u):$(id -g)" trivy-report.json 2>/dev/null || true
          ls -l trivy-report.json

      - name: Summarise findings
        # Quoted heredoc - see the dependency-scan job for why inline
        # `node -e '...'` is avoided.
        run: |
          cat > /tmp/summarise-trivy.js <<'SUMMARISER'
          const fs = require("fs");
          let report = { Results: [] };
          try { report = JSON.parse(fs.readFileSync("trivy-report.json", "utf8")); } catch (e) {}

          const results = report.Results || [];
          let osCrit = 0, osHigh = 0, libCrit = 0, libHigh = 0;
          const rows = [];

          for (const r of results) {
            const vulns = r.Vulnerabilities || [];
            if (!vulns.length) continue;
            const isOS = r.Class === "os-pkgs";
            let c = 0, h = 0;
            for (const v of vulns) {
              if (v.Severity === "CRITICAL") c++;
              else if (v.Severity === "HIGH") h++;
            }
            if (isOS) { osCrit += c; osHigh += h; } else { libCrit += c; libHigh += h; }
            rows.push({ target: r.Target, cls: r.Class, type: r.Type || "-", c, h, vulns });
          }

          let md = "## Container image scan (Trivy)\n\n";
          md += "Image scanned: `nodegoat-devsec/web:local` - the exact artifact built by the `build` job this run.\n\n";
          md += "| Layer | Critical | High |\n|---|---|---|\n";
          md += "| **Base image** (Alpine OS packages) | " + osCrit + " | " + osHigh + " |\n";
          md += "| **Application dependencies** (Node.js packages) | " + libCrit + " | " + libHigh + " |\n";
          md += "| **Total** | **" + (osCrit + libCrit) + "** | **" + (osHigh + libHigh) + "** |\n\n";

          md += "### Why the split matters\n\n";
          md += "The base image contributes " + osCrit + " critical and " + osHigh + " high findings. Everything else comes from the application dependency tree that NodeGoat ships, which the dependency-scan gate already reports and which the remediation workstream owns.\n\n";

          for (const r of rows) {
            md += "<details><summary><b>" + r.target + "</b> (" + r.cls + ") - " + r.c + " critical, " + r.h + " high</summary>\n\n";
            md += "| Severity | CVE | Package | Installed |\n|---|---|---|---|\n";
            const shown = r.vulns.slice(0, 25);
            for (const v of shown) {
              md += "| " + v.Severity + " | " + v.VulnerabilityID + " | `" + v.PkgName + "` | " + (v.InstalledVersion || "") + " |\n";
            }
            if (r.vulns.length > shown.length) md += "\n_...and " + (r.vulns.length - shown.length) + " more. Full report in the uploaded artifact._\n";
            md += "\n</details>\n\n";
          }

          md += "_Report-only gate. A future enforcing threshold of OS-level CRITICAL only currently stands at " + osCrit + ", which would catch a base-image regression without being blocked by the application vulnerabilities this project exists to demonstrate._\n";

          fs.writeFileSync(process.env.GITHUB_STEP_SUMMARY, md, { flag: "a" });
          console.log("OS: " + osCrit + " critical, " + osHigh + " high");
          console.log("Lib: " + libCrit + " critical, " + libHigh + " high");
          fs.writeFileSync("trivy-os-critical.txt", String(osCrit));
          SUMMARISER

          node /tmp/summarise-trivy.js

      - name: Upload scan report as an artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: container-scan-trivy-report
          path: trivy-report.json
          retention-days: 7

      - name: Gate decision
        # Report-only, for the reason in the job header.
        #
        # The narrow threshold that WOULD be safe to enforce here is OS-level
        # CRITICAL, because base-image CVEs are our responsibility and are
        # fixable by changing the base image - unlike the application
        # dependencies, which are the subject of another workstream.
        run: |
          OS_CRITICAL=$(cat trivy-os-critical.txt 2>/dev/null || echo 0)
          echo "Base-image (OS package) CRITICAL findings: $OS_CRITICAL"

          if [ "$OS_CRITICAL" -gt 0 ]; then
            echo "::warning::Container scan found $OS_CRITICAL CRITICAL finding(s) in base-image OS packages. Reported, not enforced."
            # exit 1   # <-- uncomment to enforce on base-image CRITICAL findings
          else
            echo "No CRITICAL findings in base-image OS packages."
          fi

          echo "Gate is REPORT-ONLY. Not failing the build."

  # =========================================================================
  # JOB 4: ci-status
  #
  # A single aggregating job that succeeds only if every other job succeeded.
  #
  # Why bother: branch protection rules name required status checks
  # individually. With this job, only "CI status" needs to be marked required -
  # and when Step 2 adds scanning jobs, they are added to `needs` here and are
  # automatically enforced, with no change to the branch protection settings.
  #
  # `if: always()` makes it run even when a dependency failed; without it the
  # job would be skipped and branch protection could read a skip as a pass.
  # =========================================================================
  ci-status:
    name: CI status
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, build, smoke-test, sast, dependency-scan, secrets-scan, container-scan]

    steps:
      - name: Report and enforce job results
        run: |
          echo "lint:            ${{ needs.lint.result }}"
          echo "build:           ${{ needs.build.result }}"
          echo "smoke-test:      ${{ needs.smoke-test.result }}"
          echo "sast:            ${{ needs.sast.result }}"
          echo "dependency-scan: ${{ needs.dependency-scan.result }}"
          echo "secrets-scan:    ${{ needs.secrets-scan.result }}   (enforcing)"
          echo "container-scan:  ${{ needs.container-scan.result }}"
          echo

          failed=0
          for result in \
            "${{ needs.lint.result }}" \
            "${{ needs.build.result }}" \
            "${{ needs.smoke-test.result }}" \
            "${{ needs.sast.result }}" \
            "${{ needs.dependency-scan.result }}" \
            "${{ needs.secrets-scan.result }}" \
            "${{ needs.container-scan.result }}"
          do
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done

          if [ "$failed" -eq 1 ]; then
            echo "CI FAILED - at least one job did not succeed."
            exit 1
          fi

          echo "CI PASSED - all jobs succeeded."

# ---------------------------------------------------------------------------
# EXTENSION POINTS FOR STEP 2 (security gates)
#
# The graph is currently:
#
#     lint  ─────────────┐
#                        ├──► ci-status
#     build ──► smoke-test ┘
#
# Step 2 slots in without restructuring:
#
#   secrets-scan     no `needs` - runs in parallel with lint and build.
#                    Scans the working tree and git history (gitleaks /
#                    trufflehog). Expected findings are documented in
#                    README.md under "Known hardcoded secrets".
#
#   sast             no `needs` - parallel. Source analysis (CodeQL / Semgrep).
#                    Needs `permissions: security-events: write` on that job.
#
#   dependency-scan  no `needs` - parallel. SCA against package-lock.json
#                    (npm audit / Snyk / OWASP Dependency-Check).
#
#   container-scan   `needs: build` - downloads the SAME image artifact this
#                    file already publishes and scans it (Trivy / Grype).
#                    No second build required, which is precisely why the
#                    build job exports the image rather than keeping it local.
#
# Each new job is then added to `ci-status.needs` to become enforcing.
#
# NOTE ON THE TEST SUITE
# NodeGoat ships no usable automated tests:
#   - test/unit/ does not exist, so `npm test` runs nothing and always passes.
#   - test/e2e/ is Cypress 3.3.1 (2019); the binary is not installed, and the
#     suite needs a running app plus a live database.
#   - test/security/ needs an OWASP ZAP proxy at a hardcoded VirtualBox address
#     (192.168.56.20:8080) and an undeclared chromedriver dependency. It is also
#     DAST, which belongs to Step 2.
# The smoke-test job is the deliberate, documented response to that gap.
# ---------------------------------------------------------------------------
